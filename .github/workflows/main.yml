name: ESP32 PlatformIO CI

# Тригери: CI запускатиметься при кожному Push або створенні Pull Request у гілки main та develop
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Завантаження коду з вашого репозиторію
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Встановлення Python (потрібен для ядра PlatformIO)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Встановлення PlatformIO
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      # 4. Компіляція прошивки для ESP32
      - name: Build firmware
        run: pio run

      # 5. Запуск модульних тестів (для логіки буфера, математики, AES без плати)
      # Примітка: вимагає наявності секції [env:native] у платформі platformio.ini
      - name: Run Unit Tests (Native)
        run: pio test -e native

      # 6. Збереження зкомпільованого файлу (артефакту) для ручної прошивки
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: .pio/build/*/firmware.bin
          retention-days: 7
